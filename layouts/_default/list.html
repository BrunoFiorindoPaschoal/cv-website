{{ define "main" }}
<div class="spacer"></div>

<h1>{{ .Title }}</h1>
<div class="buttons-container">
    {{ range .Pages }}
        <a class="button-item" href="{{ .RelPermalink }}">
            <span class="button-link">{{ .Title }}</span>
            <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" class="button-image">
        </a>
    {{ end }}
</div>
<div class="spacer"></div>
{{ end }}
