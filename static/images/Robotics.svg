<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Cable-driven positioning system: two motor spools on towers move a suspended payload</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2fc"/>
      <stop offset="1" stop-color="#d7e6f8"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa9bb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bg)"/>

  <!-- ground -->
  <rect x="0" y="262" width="400" height="38" fill="url(#hatch)" opacity=".5"/>
  <line x1="20" y1="262" x2="380" y2="262" stroke="#5b6b7f" stroke-width="3"/>

  <!-- towers (truss frame) -->
  <g stroke="#3b4a5c" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M40 262 L40 70 M64 262 L64 70 M40 70 L64 70"/>
    <path d="M40 262 L64 214 L40 166 L64 118 L40 70"/>
    <path d="M336 262 L336 70 M360 262 L360 70 M336 70 L360 70"/>
    <path d="M360 262 L336 214 L360 166 L336 118 L360 70"/>
  </g>

  <!-- motor + spool on each tower -->
  <g>
    <rect x="30" y="38" width="44" height="22" rx="4" fill="#3b4a5c"/>
    <circle cx="60" cy="60" r="16" fill="#4A90E2" stroke="#2c6cb5" stroke-width="3"/>
    <circle cx="60" cy="60" r="5" fill="#fff"/>
    <rect x="326" y="38" width="44" height="22" rx="4" fill="#3b4a5c"/>
    <circle cx="340" cy="60" r="16" fill="#4A90E2" stroke="#2c6cb5" stroke-width="3"/>
    <circle cx="340" cy="60" r="5" fill="#fff"/>
  </g>

  <!-- workspace trajectory -->
  <path d="M110 200 C 150 120, 250 120, 290 200" fill="none" stroke="#4A90E2" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/>
  <path d="M284 190 L290 200 L279 199" fill="none" stroke="#4A90E2" stroke-width="2" opacity=".8"/>

  <!-- cables -->
  <g stroke="#1f2a37" stroke-width="2.2">
    <line x1="74" y1="66" x2="214" y2="150"/>
    <line x1="326" y1="66" x2="226" y2="150"/>
  </g>
  <text x="128" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c6cb5">L₁</text>
  <text x="292" y="122" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c6cb5">L₂</text>

  <!-- payload (camera) -->
  <g>
    <rect x="203" y="150" width="34" height="24" rx="4" fill="#f5a623" stroke="#b97a10" stroke-width="2"/>
    <circle cx="220" cy="162" r="6" fill="#fff" stroke="#b97a10" stroke-width="2"/>
  </g>

  <!-- controller board -->
  <g transform="translate(150 222)">
    <rect width="100" height="30" rx="4" fill="#2f8f5b" stroke="#1d6b41" stroke-width="2"/>
    <rect x="10" y="9" width="22" height="12" fill="#1f2a37"/>
    <rect x="40" y="9" width="22" height="12" fill="#1f2a37"/>
    <g fill="#e8d36a"><circle cx="72" cy="10" r="2"/><circle cx="80" cy="10" r="2"/><circle cx="88" cy="10" r="2"/><circle cx="72" cy="20" r="2"/><circle cx="80" cy="20" r="2"/><circle cx="88" cy="20" r="2"/></g>
  </g>
  <g stroke="#2f8f5b" stroke-width="1.6" fill="none" stroke-dasharray="3 4">
    <path d="M150 237 L52 237 L52 80"/>
    <path d="M250 237 L348 237 L348 80"/>
  </g>
</svg>
